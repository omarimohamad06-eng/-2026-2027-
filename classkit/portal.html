<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes notes — ClassKit</title>
<meta name="theme-color" content="#1f1d1a">
<link rel="icon" href="img/logo-tile.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/ck.css?v=20261124b">
<style>
  main{max-width:640px}
  .big{font-size:34px;font-weight:800}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
  .kpi b{display:block;font-size:22px}
  .meter{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:4px}
  .meter i{display:block;height:100%;background:var(--accent);transform-origin:left;animation:grow 1s .25s cubic-bezier(.3,.7,.2,1) both}
  .splash{min-height:60vh;display:grid;place-content:center;justify-items:center;gap:6px;color:var(--ink)}
  .splash .mk{width:110px;height:110px}
  .splash p{color:var(--muted);font-weight:600;animation:fadeUp .5s 1s both}
  .loginmark{width:64px;height:64px;padding:10px;border-radius:16px;background:var(--ink);color:#fff;margin:0 auto 6px}
  .loginmark .mk{width:100%;height:100%}
  .panel.shake{animation:shake .45s ease}
  #m.enter > *{animation:fadeUp .45s ease both}
  #m.enter > *:nth-child(2){animation-delay:.07s}#m.enter > *:nth-child(3){animation-delay:.14s}#m.enter > *:nth-child(4){animation-delay:.21s}#m.enter > *:nth-child(5){animation-delay:.28s}#m.enter > *:nth-child(n+6){animation-delay:.35s}
  .ev{animation:fadeUp .4s ease both}
  .line{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin:10px 0}
  .ev{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eee7da;font-size:14px}
  .ev .d{font-weight:800;min-width:44px;text-align:center;border-radius:8px;padding:2px 0}
  .ev .d.p{background:var(--ok-pale);color:var(--ok)} .ev .d.m{background:var(--bad-pale);color:var(--bad)} .ev .d.s{background:var(--accent-pale);color:var(--accent)}
  .note{background:#fffbea;border:1px solid #f1e1a6;border-radius:12px;padding:10px 12px;white-space:pre-wrap}
  .pinin{font:700 22px ui-monospace,monospace;letter-spacing:.25em;text-transform:uppercase;text-align:center}
</style>
</head>
<body>
<header class="top"><div class="brand"><span id="brandmark"></span>Mes notes</div><span class="spacer"></span><a href="quiz.html" class="btn sm">Quiz</a><button class="btn sm hidden" id="out">Déconnexion</button></header>
<main id="m"><div class="splash" id="splash"></div></main>
<script src="js/shared.js?v=20261124b"></script>
<script>
(function () {
  const { esc, fmt } = CK;
  const m = document.getElementById('m');
  document.getElementById('brandmark').outerHTML = CK.logo({ draw: true });
  document.getElementById('splash').innerHTML = CK.logo({ draw: true }) + '<p>Chargement…</p>';
  const MEM = 'classkit.portal.login';
  let data;
  const FL = { part: 'Participation', absAdj: 'Absence (ajustement)', cb1: 'Organisation du cahier', cb2: 'Organisation du cahier (2e contrôle)', tr1: 'Travail à rédiger 1', tr2: 'Travail à rédiger 2', t1: 'Contrôle 1', t2: 'Contrôle 2', t3: 'Contrôle 3' };

  async function load() {
    try {
      const r = await fetch('data/portal.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      data = await r.json();
    } catch (e) {
      m.innerHTML = '<div class="panel">Ton professeur n’a pas encore publié les notes. Réessaie plus tard.</div>';
      return;
    }
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(MEM) || 'null'); } catch (e) {}
    if (saved) { if (!(await tryOpen(saved.c, saved.n, saved.p, false))) loginForm(); }
    else loginForm();
  }

  function loginForm(err) {
    document.getElementById('out').classList.add('hidden');
    m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter');
    m.innerHTML = `<div class="panel ${err ? 'shake' : ''}">
      <div class="loginmark">${CK.logo({ draw: !err })}</div>
      <h2>Connexion</h2>
      <p class="muted small">${esc(data.subject || '')} ${data.teacher ? '· ' + esc(data.teacher) : ''} · ${esc(data.year || '')}</p>
      <label class="f">Classe<select id="c">${data.classes.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><br>
      <label class="f">Ton numéro dans la liste de la classe<input type="number" id="n" min="1" inputmode="numeric"></label><br>
      <label class="f">Code PIN (sur le papier donné par ton professeur)<input type="text" id="p" class="pinin" maxlength="8" autocomplete="off" autocapitalize="characters"></label>
      <label class="row small" style="margin-top:10px"><input type="checkbox" id="rem" checked> Se souvenir de moi sur ce téléphone</label>
      ${err ? `<p style="color:var(--bad)">${esc(err)}</p>` : ''}
      <button class="btn pri" id="go" style="width:100%;margin-top:12px;padding:12px">Voir mes notes</button></div>`;
    document.getElementById('go').onclick = async () => {
      const b = document.getElementById('go'); b.disabled = true; b.textContent = 'Vérification…';
      const ok = await tryOpen(document.getElementById('c').value, +document.getElementById('n').value, document.getElementById('p').value, document.getElementById('rem').checked);
      if (!ok) loginForm('Numéro ou code PIN incorrect.');
    };
  }

  async function tryOpen(c, n, p, remember) {
    const box = data.records[c + ':' + n];
    if (!box || !p) return false;
    try {
      const rec = await CK.open(box, p);
      if (remember) localStorage.setItem(MEM, JSON.stringify({ c, n, p }));
      show(rec);
      return true;
    } catch (e) { return false; }
  }

  function meter(v, max) { return `<div class="meter"><i style="width:${Math.max(0, Math.min(100, (v || 0) / max * 100))}%"></i></div>`; }
  function show(r) {
    const out = document.getElementById('out');
    out.classList.remove('hidden');
    out.onclick = () => { localStorage.removeItem(MEM); loginForm(); };
    const g = r.g, k = r.comp;
    const log = (r.log || []).slice().reverse();
    const c = r.cfg, mx = { part: c.maxPart || 5, abs: c.maxAbs || 5, cah: c.maxCahier || 5, tra: c.maxTravail || 5 };
    const d = t => new Date(t).toLocaleString('fr-FR', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    m.innerHTML = `
      <div class="panel"><div class="row"><div><div class="ar" style="font-size:20px;font-weight:800">${esc(r.name)}</div><div class="muted small">${esc(r.cls)} · N° ${r.n}</div></div><span class="spacer"></span>
        <div style="text-align:center"><div class="big">${fmt(k.final)}</div><div class="small muted">note générale /20</div></div></div>
        ${k.testsAvg != null ? `<p class="small muted" style="margin:8px 0 0">Moyenne des contrôles ${fmt(k.testsAvg)} × ${Math.round(k.weightTests * 100)} % + activités ${fmt(k.act)} × ${Math.round((1 - k.weightTests) * 100)} % = <b>${fmt(k.final)}</b></p>` : ''}</div>
      <div class="kpis"><div class="kpi"><b>${fmt(k.act)}</b><span class="small muted">Activités /20</span></div>${(k.tests || [k.t1, k.t2]).map((t, i) => `<div class="kpi"><b>${fmt(t)}</b><span class="small muted">Contrôle ${i + 1}</span></div>`).join('')}</div>
      <div class="panel" style="margin-top:14px"><h3 style="margin-top:0">Activités intégrées</h3>
        <div class="line"><span>Participation</span><b>${fmt(k.part)} / ${mx.part}</b></div>${meter(k.part, mx.part)}
        <div class="line"><span>Absence <span class="small muted">(${k.nAbs} séance(s) d’absence)</span></span><b>${fmt(k.absence)} / ${mx.abs}</b></div>${meter(k.absence, mx.abs)}
        <div class="line"><span>Organisation du cahier${c.cahierChecks === 1 ? '' : ` <span class="small muted">(contrôles : ${fmt(+g.cb1 || 0)} et ${fmt(+g.cb2 || 0)})</span>`}</span><b>${fmt(k.cahier)} / ${mx.cah}</b></div>${meter(k.cahier, mx.cah)}
        <div class="line"><span>Travail à rédiger${c.travailCount === 1 ? '' : ` <span class="small muted">(travaux : ${fmt(+g.tr1 || 0)} et ${fmt(+g.tr2 || 0)})</span>`}</span><b>${fmt(k.travail)} / ${mx.tra}</b></div>${meter(k.travail, mx.tra)}
      </div>
      ${g.note ? `<div class="panel"><h3 style="margin-top:0">Remarque du professeur</h3><div class="note ar">${esc(g.note)}</div></div>` : ''}
      <div class="panel"><h3 style="margin-top:0">Chaque changement de ta note</h3>
        ${log.map(e => {
          const set = e.set !== undefined;
          const cls = set ? 's' : (e.d > 0 ? 'p' : 'm');
          return `<div class="ev"><span class="d ${cls}">${set ? (e.set === '' ? '—' : e.set) : (e.d > 0 ? '+' : '') + e.d}</span><span><b>${FL[e.f] || esc(e.f)}</b>${e.why ? ' — ' + esc(e.why) : ''}<br><span class="small muted">${d(e.t)}</span></span></div>`;
        }).join('') || '<p class="muted">Aucun changement pour l’instant.</p>'}
      </div>
      ${r.quizzes && r.quizzes.length ? `<div class="panel"><h3 style="margin-top:0">Quiz</h3>${r.quizzes.map(q => `<div class="line"><span>${esc(q.title)} ${q.status !== 'done' ? `<span class="pill ${q.status === 'timeup' ? 'warn' : 'bad'}">${q.status === 'timeup' ? 'temps écoulé' : 'exclu'}</span>` : ''}</span><b>${fmt(q.score)} / ${q.outOf}</b></div>`).join('')}</div>` : ''}
      ${r.cards && r.cards.length ? `<div class="panel"><h3 style="margin-top:0">Questions avec les cartes QR</h3>${r.cards.slice().reverse().map(x => `<div class="line"><span class="small"><span class="muted">${x.date}</span> <span class="ar">${esc(x.q || '')}</span></span><b>${x.a ? (x.ok ? (x.a === x.ok ? '✓ ' : '✗ ') + x.a : x.a) : '<span class="muted">—</span>'}</b></div>`).join('')}</div>` : ''}
      <div class="panel"><h3 style="margin-top:0">Absences</h3>${r.abs.length ? `<p><b>${r.abs.length}</b> séance(s) : ${r.abs.map(x => new Date(x).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })).join(', ')}</p>` : '<p class="muted">Aucune 👏</p>'}</div>
      <p class="small muted" style="text-align:center">Mis à jour le ${new Date(data.updated).toLocaleString('fr-FR')}</p>`;
    // motion: panels slide in one after another, bars grow, grades count up
    m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter');
    CK.countUp(m.querySelector('.big'), k.final);
    m.querySelectorAll('.kpi b').forEach((el, i) => CK.countUp(el, [k.act].concat(k.tests || [k.t1, k.t2])[i]));
  }
  load();
})();
</script>
</body>
</html>
