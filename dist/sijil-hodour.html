<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجل الحضور والغياب 2026/2027</title>
<meta name="theme-color" content="#0d3b2e">
<style>
/* Charte graphique du registre officiel : vert foncé, doré, fond ivoire */
:root{
  --vert:#0d3b2e;
  --vert-clair:#1a5c48;
  --vert-pale:#e6efea;
  --dore:#c9a227;
  --dore-pale:#f6edcf;
  --ivoire:#faf6ec;
  --papier:#ffffff;
  --texte:#1c2b26;
  --texte-doux:#5c6b66;
  --bord:#d6cfba;
  --rouge:#b3261e;
  --rouge-pale:#fbe3e1;
  --ambre:#b8860b;
  --ambre-pale:#fbf0d5;
  --bleu:#1c4f7c;
  --grise:#cfc8b6;
  --ombre:0 1px 3px rgba(13,59,46,.12), 0 4px 16px rgba(13,59,46,.07);
  --rayon:10px;
  --police:"Amiri","Cairo","Noto Naskh Arabic","Tahoma","Segoe UI",serif;
  --police-ui:"Cairo","Noto Kufi Arabic","Segoe UI",system-ui,sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
#print-area{display:none}
html,body{margin:0;padding:0}
body{
  font-family:var(--police-ui);
  background:var(--ivoire);
  color:var(--texte);
  font-size:15px;
  line-height:1.55;
  min-height:100vh;
  display:flex;flex-direction:column;
}
h1,h2,h3{font-family:var(--police);margin:0 0 .4em}
h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
a{color:var(--vert-clair)}

/* ---------- Barre supérieure ---------- */
.topbar{
  background:linear-gradient(180deg,var(--vert) 0%,var(--vert-clair) 100%);
  color:#fff;padding:.55rem 1rem;display:flex;gap:1rem;align-items:center;
  flex-wrap:wrap;box-shadow:var(--ombre);position:sticky;top:0;z-index:40;
}
.brand{display:flex;gap:.6rem;align-items:center}
.brand-mark{color:var(--dore);font-size:1.6rem;line-height:1}
.brand strong{display:block;font-family:var(--police);font-size:1.1rem}
.brand small{display:block;color:var(--dore-pale);font-size:.72rem}
.nav{display:flex;gap:.25rem;flex-wrap:wrap;margin-inline-start:auto}
.nav a{
  color:#e9f2ee;text-decoration:none;padding:.35rem .7rem;border-radius:999px;
  font-size:.85rem;border:1px solid transparent;white-space:nowrap;
}
.nav a:hover{background:rgba(255,255,255,.12)}
.nav a.active{background:var(--dore);color:var(--vert);border-color:var(--dore);font-weight:700}

.lang-btn{
  font-family:var(--police-ui);font-size:.78rem;font-weight:800;cursor:pointer;
  color:var(--vert);background:var(--dore-pale);border:1px solid var(--dore);
  border-radius:999px;padding:.25rem .6rem;min-width:34px;line-height:1.4;
}
.lang-btn:hover{background:var(--dore)}

.view{flex:1;padding:1rem;max-width:1600px;width:100%;margin:0 auto}
.credits{text-align:center;color:var(--texte-doux);font-size:.75rem;padding:.8rem}

/* ---------- Blocs ---------- */
.card{
  background:var(--papier);border:1px solid var(--bord);border-radius:var(--rayon);
  padding:1rem;margin-bottom:1rem;box-shadow:var(--ombre);
}
.card-head{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.card-head h2{margin:0}
.card-head .spacer{margin-inline-start:auto}
.grid{display:grid;gap:.8rem}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.muted{color:var(--texte-doux)}
.small{font-size:.8rem}
.hint{background:var(--dore-pale);border:1px solid var(--dore);border-radius:8px;padding:.6rem .8rem;font-size:.85rem;margin-bottom:.8rem}
.hint b{color:var(--vert)}

/* ---------- Formulaires ---------- */
label{display:block;font-size:.82rem;font-weight:600;margin-bottom:.25rem;color:var(--vert)}
input,select,textarea{
  width:100%;padding:.45rem .6rem;border:1px solid var(--bord);border-radius:8px;
  font-family:inherit;font-size:.9rem;background:#fff;color:var(--texte);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--vert-clair);outline-offset:-1px}
textarea{min-height:80px;resize:vertical}
.field{margin-bottom:.7rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:flex-end}
.actions{display:flex;gap:.4rem;flex-wrap:wrap;margin-inline-start:auto}

/* ---------- Boutons ---------- */
.btn{
  font-family:inherit;font-size:.85rem;font-weight:600;cursor:pointer;
  padding:.45rem .9rem;border-radius:8px;border:1px solid var(--bord);
  background:#fff;color:var(--vert);white-space:nowrap;
}
.btn:hover{background:var(--vert-pale)}
.btn-primary{background:var(--vert);border-color:var(--vert);color:#fff}
.btn-primary:hover{background:var(--vert-clair)}
.btn-gold{background:var(--dore);border-color:var(--dore);color:var(--vert)}
.btn-gold:hover{filter:brightness(1.07)}
.btn-danger{color:var(--rouge);border-color:#e6c3c0}
.btn-danger:hover{background:var(--rouge-pale)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-sm{padding:.2rem .5rem;font-size:.78rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- Tableaux génériques ---------- */
/* Les tableaux larges défilent dans leur propre conteneur : la page, elle,
   ne défile jamais horizontalement (indispensable sur mobile). */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table-wrap>table.data{min-width:520px}
table.data{width:100%;border-collapse:collapse;font-size:.87rem}
table.data th,table.data td{border:1px solid var(--bord);padding:.35rem .5rem;text-align:right}
table.data thead th{background:var(--vert);color:#fff;font-weight:600;position:sticky;top:0}
table.data tbody tr:nth-child(even){background:#fbfaf5}
table.data tbody tr:hover{background:var(--vert-pale)}

/* ---------- Grille du registre ---------- */
.register-wrap{overflow:auto;max-height:72vh;border:2px solid var(--vert);border-radius:6px;background:#fff;direction:rtl}
.register-wrap>table.register{direction:rtl}
table.register{border-collapse:separate;border-spacing:0;font-size:.8rem;width:max-content;min-width:100%}
table.register th,table.register td{
  border-inline-start:1px solid var(--bord);border-block-end:1px solid var(--bord);
  padding:0;text-align:center;white-space:nowrap;
  /* La grille reste ordonnée de droite à gauche comme le registre officiel,
     mais chaque cellule s'écrit dans le sens de son propre texte : les noms
     arabes restent RTL, les libellés français passent en LTR. */
  unicode-bidi:plaintext;
}
table.register thead th{
  background:var(--vert);color:#fff;position:sticky;top:0;z-index:20;
  font-weight:600;padding:.2rem .25rem;
}
table.register thead tr:nth-child(2) th{top:24px}
th.col-rt,td.col-rt{position:sticky;inset-inline-start:0;z-index:25;background:var(--vert-pale);width:38px;min-width:38px}
th.col-nom,td.col-nom{position:sticky;inset-inline-start:38px;z-index:25;background:var(--vert-pale);
  min-width:190px;max-width:190px;text-align:start;padding:.15rem .4rem;
  font-family:var(--police);font-size:.88rem;overflow:hidden;text-overflow:ellipsis;
  border-inline-end:2px solid var(--vert);
}
thead th.col-rt,thead th.col-nom{background:var(--vert);color:#fff;z-index:30}
td.col-nom{cursor:default}
.register tbody tr:nth-child(even) td.col-rt,.register tbody tr:nth-child(even) td.col-nom{background:#dfeae4}

th.day{width:26px;min-width:26px;font-size:.72rem}
th.day .dnum{display:block;font-weight:700}
th.day .dab{display:block;font-size:.62rem;opacity:.85}
th.day.off{background:var(--grise);color:#4a463c}
th.day.today{background:var(--dore);color:var(--vert)}

td.cell{width:26px;min-width:26px;height:24px;cursor:pointer;user-select:none;font-size:.8rem;font-weight:700}
td.cell:hover{outline:2px solid var(--dore);outline-offset:-2px}
td.cell.off{background:var(--grise);cursor:not-allowed}
td.cell.off:hover{outline:none}
td.cell.s-a{background:var(--rouge-pale);color:var(--rouge)}
td.cell.s-am{background:linear-gradient(to bottom,var(--rouge-pale) 50%,#fff 50%);color:var(--rouge)}
td.cell.s-pm{background:linear-gradient(to bottom,#fff 50%,var(--rouge-pale) 50%);color:var(--rouge)}
td.cell.s-aj{background:var(--ambre-pale);color:var(--ambre)}
td.cell.s-r{background:var(--dore-pale);color:var(--ambre)}
td.cell.s-p{background:#e7f4ec;color:var(--vert-clair)}
td.cell.out{background:repeating-linear-gradient(45deg,#f2efe6,#f2efe6 4px,#e8e3d5 4px,#e8e3d5 8px);cursor:not-allowed}

/* colonne de congé : libellé vertical */
th.day.off .vlabel{
  writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);
  font-size:.6rem;max-height:80px;overflow:hidden;display:block;margin:2px auto 0;
  font-family:var(--police);
}
.register thead tr.vac th{height:92px;vertical-align:bottom;background:var(--vert)}

td.sum{background:#f5f2e7;font-weight:700;min-width:44px;width:44px}
td.sum.taux{color:var(--vert);background:var(--dore-pale)}
td.sum.bad{color:var(--rouge)}
th.sum{background:var(--vert-clair);min-width:44px;width:44px;font-size:.68rem;white-space:normal;line-height:1.1;padding:.15rem}
td.note,th.note{min-width:150px;max-width:150px;text-align:start}
td.note input{border:none;background:transparent;font-size:.78rem;padding:.1rem .3rem}
td.note input:focus{background:#fff;outline:1px solid var(--dore)}
tfoot td{background:var(--vert);color:#fff;font-weight:700;font-size:.8rem;padding:.25rem}
tfoot td.taux-global{background:var(--dore);color:var(--vert)}

/* ---------- Palette de saisie ---------- */
.brush{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;margin-bottom:.6rem}
.brush button{
  border:1px solid var(--bord);background:#fff;border-radius:8px;padding:.3rem .6rem;
  font-size:.8rem;cursor:pointer;font-family:inherit;display:flex;gap:.3rem;align-items:center;
}
.brush button.on{border-color:var(--vert);background:var(--vert);color:#fff;font-weight:700}
.chip{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}

/* ---------- Statistiques ---------- */
.stat{background:#fff;border:1px solid var(--bord);border-radius:var(--rayon);padding:.8rem;text-align:center}
.stat .v{font-size:1.6rem;font-weight:800;color:var(--vert);font-family:var(--police)}
.stat .l{font-size:.78rem;color:var(--texte-doux)}
.badge{display:inline-block;padding:.1rem .45rem;border-radius:999px;font-size:.72rem;font-weight:700}
.badge.ok{background:#e7f4ec;color:var(--vert-clair)}
.badge.warn{background:var(--ambre-pale);color:var(--ambre)}
.badge.bad{background:var(--rouge-pale);color:var(--rouge)}
.bar{height:8px;background:var(--vert-pale);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--vert-clair)}

/* ---------- Toast & modale ---------- */
.toast{
  position:fixed;bottom:1rem;inset-inline-start:1rem;background:var(--vert);color:#fff;
  padding:.6rem 1rem;border-radius:8px;box-shadow:var(--ombre);z-index:90;font-size:.85rem;
}
.toast.err{background:var(--rouge)}
.modal{position:fixed;inset:0;background:rgba(13,59,46,.45);display:flex;align-items:center;justify-content:center;z-index:80;padding:1rem}
.modal-box{background:#fff;border-radius:var(--rayon);padding:1rem;max-width:520px;width:100%;box-shadow:var(--ombre);max-height:85vh;overflow:auto}
.modal-actions{display:flex;gap:.5rem;justify-content:flex-start;margin-top:.9rem}

.empty{text-align:center;padding:2.5rem 1rem;color:var(--texte-doux)}
.empty .big{font-size:2.4rem;color:var(--dore)}

@media (max-width:640px){
  .view{padding:.6rem}
  .card{padding:.7rem}
  .card-head h2{font-size:1.05rem}
  .row>.actions{width:100%}
  .nav a{font-size:.78rem;padding:.3rem .55rem}
  th.col-nom,td.col-nom{min-width:130px;max-width:130px}
}

</style>
<style media="print">
/* ================= Mise en page d'impression : A4 paysage, fidèle au registre officiel ================= */
@page{ size:A4 landscape; margin:7mm; }

@media print{
  html,body{background:#fff !important;margin:0;padding:0}
  .no-print,.topbar,.credits,#toast,#modal,.view{display:none !important}
  #print-area{display:block !important}

  .sheet{
    page-break-after:always;break-after:page;
    position:relative;
    height:196mm;overflow:hidden;
    padding:3.5mm 5mm;
    border:2.4pt double #0d3b2e;
    outline:.8pt solid #c9a227;outline-offset:2.2pt;
    font-family:"Amiri","Cairo","Noto Naskh Arabic",serif;
    color:#101a17;
    direction:rtl;
  }
  .sheet:last-child{page-break-after:auto;break-after:auto}

  .sheet-head{text-align:center;margin-bottom:1.2mm;line-height:1.28}
  .sheet-head .kingdom{font-size:8.6pt;font-weight:700}
  .sheet-head .ministry{font-size:7.8pt}
  .sheet-head .title{
    font-size:12pt;font-weight:700;color:#0d3b2e;margin:.8mm 0 .4mm;
    border-block:1pt solid #c9a227;padding:.4mm 0;display:inline-block;padding-inline:12mm;
  }
  .sheet-meta{display:flex;justify-content:space-between;gap:3mm;font-size:7.6pt;margin-bottom:1mm;flex-wrap:wrap}
  .sheet-meta span{white-space:nowrap}
  .sheet-meta b{color:#0d3b2e}

  table.sheet-grid{width:100%;border-collapse:collapse;table-layout:fixed;font-size:6.6pt}
  table.sheet-grid thead{display:table-header-group}
  table.sheet-grid th,table.sheet-grid td{border:.5pt solid #4a5b55;text-align:center;padding:0;height:3.3mm;line-height:1.05;overflow:hidden}
  table.sheet-grid thead th{background:#e6efea;font-weight:700;font-size:6.2pt}
  table.sheet-grid td.nom{text-align:right;padding-inline:1mm;font-size:7.2pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.sheet-grid th.rt,table.sheet-grid td.rt{width:7mm}
  table.sheet-grid th.nom{width:46mm}
  table.sheet-grid th.sum,table.sheet-grid td.sum{width:9mm;background:#f5f2e7;font-weight:700}
  table.sheet-grid th.note,table.sheet-grid td.note{width:30mm;text-align:right;padding-inline:1mm;font-size:6.4pt}
  table.sheet-grid td.off,table.sheet-grid th.off{background:#cfc8b6}
  table.sheet-grid th.off .vlabel{
    writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);
    font-size:5pt;display:block;margin:0 auto;max-height:13.5mm;overflow:hidden;
  }
  table.sheet-grid thead tr.vac th{height:18mm;vertical-align:bottom;padding-bottom:.3mm}
  table.sheet-grid td.a{color:#b3261e;font-weight:700}
  table.sheet-grid td.aj{color:#8a6508;font-weight:700}
  table.sheet-grid tfoot td{background:#e6efea;color:#0d3b2e;font-weight:700;font-size:7pt;height:5mm}

  .sheet-foot{
    display:flex;justify-content:space-between;font-size:6.8pt;margin-top:1.2mm;color:#31413b;
  }
  .sheet-foot .sig{text-align:center;min-width:45mm}
}

</style>

<header class="topbar no-print">
  <div class="brand">
    <span class="brand-mark">✦</span>
    <div>
      <strong id="brand-title">سجل الحضور والغياب</strong>
      <small id="brand-sub">السنة الدراسية 2026/2027</small>

  </div>
  <nav id="nav" class="nav"></nav>
  <button id="lang-btn" class="lang-btn" type="button" aria-label="Langue / اللغة">FR</button>
</header>

<main id="view" class="view"></main>

<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn btn-ghost">إلغاء</button>
      <button id="modal-ok" class="btn btn-primary">تأكيد</button>
    </div>
  </div>
</div>

<script>
/* Chargeur : recrée les modules ES sous forme d'URL blob, dans l'ordre des dépendances. */
(function () {
  var MODULES = [["src/db/idb.js","/**\n * Mini-couche IndexedDB (remplace Dexie) — aucune dépendance externe,\n * pour un fonctionnement 100 % hors-ligne.\n */\nconst DB_NAME = 'sijil_hodour_2026_2027';\nconst DB_VERSION = 1;\n\n/** store -> { keyPath, indexes: [[nom, chemin]] } */\nconst SCHEMA = {\n  settings : { keyPath: 'id', indexes: [] },\n  classes  : { keyPath: 'id', indexes: [['ordre', 'ordre']] },\n  students : { keyPath: 'id', indexes: [['classId', 'classId']] },\n  registers: { keyPath: 'id', indexes: [['classId', 'classId'], ['mois', 'mois']] },\n  calendar : { keyPath: 'id', indexes: [] },\n};\n\nexport const STORES = Object.keys(SCHEMA);\n\nlet dbPromise = null;\n\nexport function openDB() {\n  if (dbPromise) return dbPromise;\n  dbPromise = new Promise((resolve, reject) => {\n    const req = indexedDB.open(DB_NAME, DB_VERSION);\n    req.onupgradeneeded = () => {\n      const db = req.result;\n      for (const [name, def] of Object.entries(SCHEMA)) {\n        const store = db.objectStoreNames.contains(name)\n          ? req.transaction.objectStore(name)\n          : db.createObjectStore(name, { keyPath: def.keyPath });\n        for (const [idxName, path] of def.indexes) {\n          if (!store.indexNames.contains(idxName)) store.createIndex(idxName, path);\n        }\n      }\n    };\n    req.onsuccess = () => resolve(req.result);\n    req.onerror = () => reject(req.error);\n    req.onblocked = () => reject(new Error('قاعدة البيانات مفتوحة في تبويب آخر. أغلق التبويبات الأخرى.'));\n  });\n  return dbPromise;\n}\n\n/**\n * Une lecture se résout dès que la requête aboutit ; une écriture attend la\n * validation de la transaction, pour ne jamais annoncer un enregistrement\n * qu'un abandon ultérieur (quota dépassé, onglet fermé) aurait annulé.\n */\nfunction run(storeName, mode, fn) {\n  return openDB().then(db => new Promise((resolve, reject) => {\n    const tx = db.transaction(storeName, mode);\n    const req = fn(tx.objectStore(storeName));\n    let valeur;\n    tx.onerror = () => reject(tx.error);\n    tx.onabort = () => reject(tx.error || new Error('transaction annulée'));\n    if (req) {\n      req.onerror = () => reject(req.error);\n      if (mode === 'readonly') req.onsuccess = () => resolve(req.result);\n      else req.onsuccess = () => { valeur = req.result; };\n    }\n    if (mode !== 'readonly' || !req) tx.oncomplete = () => resolve(valeur);\n  }));\n}\n\nexport const get    = (store, key)    => run(store, 'readonly',  s => s.get(key));\nexport const getAll = (store)         => run(store, 'readonly',  s => s.getAll());\nexport const put    = (store, value)  => run(store, 'readwrite', s => s.put(value));\nexport const del    = (store, key)    => run(store, 'readwrite', s => s.delete(key));\nexport const clear  = (store)         => run(store, 'readwrite', s => s.clear());\n\nexport const byIndex = (store, index, value) =>\n  run(store, 'readonly', s => s.index(index).getAll(value));\n\nexport function bulkPut(store, values) {\n  return openDB().then(db => new Promise((resolve, reject) => {\n    const tx = db.transaction(store, 'readwrite');\n    const os = tx.objectStore(store);\n    for (const v of values) os.put(v);\n    tx.oncomplete = () => resolve(values.length);\n    tx.onerror = () => reject(tx.error);\n    tx.onabort = () => reject(tx.error);\n  }));\n}\n\nexport function deleteWhere(store, predicate) {\n  return openDB().then(db => new Promise((resolve, reject) => {\n    const tx = db.transaction(store, 'readwrite');\n    const os = tx.objectStore(store);\n    let n = 0;\n    os.openCursor().onsuccess = e => {\n      const cur = e.target.result;\n      if (!cur) return;\n      if (predicate(cur.value)) { cur.delete(); n++; }\n      cur.continue();\n    };\n    tx.oncomplete = () => resolve(n);\n    tx.onerror = () => reject(tx.error);\n  }));\n}\n"],["src/data/defaults.js","/** Informations de l'établissement préremplies (modifiables dans l'écran « الإعداد »). */\nexport const DEFAULT_SETTINGS = {\n  id: 1,\n  academie: 'الأكاديمية الجهوية للتربية والتكوين لجهة درعة تافيلالت',\n  direction: 'المديرية الإقليمية تنغير',\n  etablissement: 'الثانوية التأهيلية تيلمي',\n  enseignant: 'الأستاذ عمري محمد',\n  enseignantFr: 'Pr. Omari Mohammed',\n  anneeScolaire: '2026/2027',\n  langue: 'ar',                    // 'ar' ou 'fr' — langue de l'interface\n  seuilAlerteAbsence: 8,   // nombre d'anssaf ayam d'absence déclenchant une alerte (par mois)\n  seuilTauxFaible: 90,     // taux de fréquentation (%) sous lequel l'élève est signalé\n  updatedAt: null,\n};\n"],["src/data/calendar-2026-2027.js","/**\n * Calendrier scolaire marocain 2026-2027 — données de référence PRÉCHARGÉES ET MODIFIABLES.\n *\n * confirme:true  → date fixe officielle (fêtes nationales).\n * confirme:false → estimation : vacances inter-semestres (en attente de la note ministérielle)\n *                  et fêtes religieuses (dépendantes de l'observation lunaire).\n * L'écran « الرزنامة » permet de corriger, ajouter ou supprimer chaque période.\n */\nexport const CALENDAR_2026_2027 = {\n  id: 'cal_2026_2027',\n  anneeScolaire: '2026/2027',\n  debutAnnee: '2026-09-07',\n  finAnnee: '2027-06-30',\n  joursWeekend: [0],          // 0 = dimanche\n  joursDemiJournee: [6],      // samedi = 1 seul نصف يوم\n  periodes: [\n    { id:'p01', type:'vacances', libelle:'عطلة الفترة البينية الأولى',\n      du:'2026-10-18', au:'2026-10-25', confirme:false },\n    { id:'p02', type:'ferie', libelle:'ذكرى المسيرة الخضراء',\n      du:'2026-11-06', au:'2026-11-06', confirme:true },\n    { id:'p03', type:'ferie', libelle:'عيد الاستقلال',\n      du:'2026-11-18', au:'2026-11-18', confirme:true },\n    { id:'p04', type:'vacances', libelle:'عطلة الفترة البينية الثانية (نهاية السنة الميلادية)',\n      du:'2026-12-20', au:'2027-01-03', confirme:false },\n    { id:'p05', type:'ferie', libelle:'فاتح السنة الميلادية',\n      du:'2027-01-01', au:'2027-01-01', confirme:true },\n    { id:'p06', type:'ferie', libelle:'ذكرى تقديم وثيقة الاستقلال',\n      du:'2027-01-11', au:'2027-01-11', confirme:true },\n    { id:'p07', type:'ferie', libelle:'عطلة رأس السنة الأمازيغية',\n      du:'2027-01-14', au:'2027-01-14', confirme:true },\n    { id:'p08', type:'vacances', libelle:'عطلة منتصف السنة الدراسية',\n      du:'2027-01-31', au:'2027-02-07', confirme:false },\n    { id:'p09', type:'ferie', libelle:'عيد الفطر',\n      du:'2027-03-09', au:'2027-03-11', confirme:false },\n    { id:'p10', type:'vacances', libelle:'عطلة الفترة البينية الثالثة',\n      du:'2027-03-21', au:'2027-03-28', confirme:false },\n    { id:'p11', type:'ferie', libelle:'عيد الشغل',\n      du:'2027-05-01', au:'2027-05-01', confirme:true },\n    { id:'p12', type:'vacances', libelle:'عطلة الفترة البينية الرابعة',\n      du:'2027-05-09', au:'2027-05-16', confirme:false },\n    { id:'p13', type:'ferie', libelle:'عيد الأضحى',\n      du:'2027-05-17', au:'2027-05-19', confirme:false },\n    { id:'p14', type:'ferie', libelle:'فاتح محرم',\n      du:'2027-06-06', au:'2027-06-06', confirme:false },\n    { id:'p15', type:'examen', libelle:'الامتحان الموحد الجهوي',\n      du:'2027-06-07', au:'2027-06-09', confirme:false },\n    { id:'p16', type:'examen', libelle:'الامتحان الوطني الموحد',\n      du:'2027-06-21', au:'2027-06-23', confirme:false },\n  ],\n};\n\n/** Mois du registre, de septembre à juin. */\nexport const MOIS_SCOLAIRES = [\n  '2026-09','2026-10','2026-11','2026-12',\n  '2027-01','2027-02','2027-03','2027-04','2027-05','2027-06',\n];\n\nexport const NOMS_MOIS = {\n  '01':'يناير','02':'فبراير','03':'مارس','04':'أبريل','05':'ماي','06':'يونيو',\n  '07':'يوليوز','08':'غشت','09':'شتنبر','10':'أكتوبر','11':'نونبر','12':'دجنبر',\n};\n"],["src/core/attendance.js","/** États d'une cellule jour/élève et règles de comptage en أنصاف الأيام. */\n\nexport const STATES = {\n  ''  : { code:'',   label:'حاضر',            court:'',  couleur:'#ffffff', poids:0, justifie:false },\n  p   : { code:'p',  label:'حاضر (مؤكد)',     court:'✓', couleur:'#e7f4ec', poids:0, justifie:false },\n  a   : { code:'a',  label:'غائب (يوم كامل)', court:'غ', couleur:'#fbe3e1', poids:'full', justifie:false },\n  am  : { code:'am', label:'غائب صباحا',      court:'ص', couleur:'#fbe3e1', poids:'half', justifie:false },\n  pm  : { code:'pm', label:'غائب مساء',       court:'م', couleur:'#fbe3e1', poids:'half', justifie:false },\n  aj  : { code:'aj', label:'غياب مبرر',       court:'ب', couleur:'#fbf0d5', poids:'full', justifie:true  },\n  r   : { code:'r',  label:'تأخر',            court:'ت', couleur:'#f6edcf', poids:0, justifie:false },\n};\n\n/** Ordre de défilement au clic sur une cellule. */\nexport const CYCLE = ['', 'a', 'am', 'pm', 'aj', 'r'];\n\nexport const nextState = code => CYCLE[(CYCLE.indexOf(code || '') + 1) % CYCLE.length];\n\n/**\n * Anssaf ayam d'absence portés par un état, selon la capacité du jour\n * (2 pour un jour plein, 1 pour un samedi/demi-journée).\n */\nexport function poidsAbsence(code, capacite) {\n  const st = STATES[code || ''];\n  if (!st || !st.poids || capacite <= 0) return 0;\n  return st.poids === 'full' ? capacite : Math.min(1, capacite);\n}\n\nexport const estAbsence = code => !!STATES[code || '']?.poids;\nexport const estJustifie = code => !!STATES[code || '']?.justifie;\n\n/** Clé du registre mensuel : une ligne par (classe, mois). */\nexport const registerId = (classId, mois) => `${classId}__${mois}`;\n\nexport const emptyRegister = (classId, mois) => ({\n  id: registerId(classId, mois), classId, mois, cells: {}, notes: {}, updatedAt: null,\n});\n"],["src/utils/dom.js","/** Petits utilitaires DOM — remplacent une librairie de rendu. */\n\nexport const qs  = (sel, root = document) => root.querySelector(sel);\nexport const qsa = (sel, root = document) => [...root.querySelectorAll(sel)];\n\n/** h('div.card', {onclick}, ...enfants) */\nexport function h(tag, props = {}, ...children) {\n  const [name, ...classes] = String(tag).split('.');\n  const node = document.createElement(name || 'div');\n  if (classes.length) node.className = classes.join(' ');\n  for (const [k, v] of Object.entries(props || {})) {\n    if (v === null || v === undefined || v === false) continue;\n    if (k === 'class') node.className += (node.className ? ' ' : '') + v;\n    else if (k === 'html') node.innerHTML = v;\n    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);\n    else if (k === 'dataset') Object.assign(node.dataset, v);\n    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);\n    else if (k in node && k !== 'list') node[k] = v;\n    else node.setAttribute(k, v);\n  }\n  for (const c of children.flat(Infinity)) {\n    if (c === null || c === undefined || c === false) continue;\n    node.append(c instanceof Node ? c : document.createTextNode(String(c)));\n  }\n  return node;\n}\n\nexport function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }\n\nlet toastTimer;\nexport function toast(message, kind = 'ok') {\n  const t = qs('#toast');\n  t.textContent = message;\n  t.className = 'toast' + (kind === 'err' ? ' err' : '');\n  t.hidden = false;\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => { t.hidden = true; }, 3200);\n}\n\n/** Modale générique. body = Node | string. Résout true/false. */\nexport function modal({ title, body, okText = 'تأكيد', cancelText = 'إلغاء', danger = false }) {\n  return new Promise(resolve => {\n    const box = qs('#modal');\n    qs('#modal-title').textContent = title || '';\n    const b = clear(qs('#modal-body'));\n    b.append(body instanceof Node ? body : document.createTextNode(body || ''));\n    const ok = qs('#modal-ok'), cancel = qs('#modal-cancel');\n    ok.textContent = okText;\n    ok.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');\n    cancel.textContent = cancelText;\n    cancel.hidden = cancelText === null;\n    const done = value => {\n      box.hidden = true;\n      ok.removeEventListener('click', onOk);\n      cancel.removeEventListener('click', onCancel);\n      document.removeEventListener('keydown', onKey);\n      resolve(value);\n    };\n    const onOk = () => done(true), onCancel = () => done(false);\n    const onKey = e => { if (e.key === 'Escape') done(false); };\n    ok.addEventListener('click', onOk);\n    cancel.addEventListener('click', onCancel);\n    document.addEventListener('keydown', onKey);\n    box.hidden = false;\n    ok.focus();\n  });\n}\n\nexport const confirmBox = (title, text, okText = 'حذف') =>\n  modal({ title, body: text, okText, danger: true });\n\n/** Téléchargement d'un fichier généré côté client. */\nexport function download(filename, data, mime = 'application/octet-stream') {\n  const blob = data instanceof Blob ? data : new Blob([data], { type: mime + ';charset=utf-8' });\n  const url = URL.createObjectURL(blob);\n  const a = h('a', { href: url, download: filename });\n  document.body.append(a);\n  a.click();\n  a.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 2000);\n}\n\nexport const uid = (prefix = 'id') =>\n  prefix + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);\n\nexport const escapeHtml = s => String(s ?? '')\n  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n"],["src/db/repo.js","/** Accès aux données métier (au-dessus d'IndexedDB). */\nimport * as idb from '__MOD__src/db/idb.js__';\nimport { DEFAULT_SETTINGS } from '__MOD__src/data/defaults.js__';\nimport { CALENDAR_2026_2027 } from '__MOD__src/data/calendar-2026-2027.js__';\nimport { emptyRegister, registerId } from '__MOD__src/core/attendance.js__';\nimport { uid } from '__MOD__src/utils/dom.js__';\n\nconst now = () => new Date().toISOString();\n\n/** Premier démarrage : injecte les valeurs par défaut et le calendrier scolaire. */\nexport async function init() {\n  if (!(await idb.get('settings', 1))) {\n    await idb.put('settings', { ...DEFAULT_SETTINGS, updatedAt: now() });\n  }\n  if (!(await idb.get('calendar', CALENDAR_2026_2027.id))) {\n    await idb.put('calendar', structuredClone(CALENDAR_2026_2027));\n  }\n}\n\n/* ---------------- Établissement ---------------- */\nexport const getSettings = async () => (await idb.get('settings', 1)) || { ...DEFAULT_SETTINGS };\nexport const saveSettings = s => idb.put('settings', { ...s, id: 1, updatedAt: now() });\n\n/* ---------------- Calendrier ---------------- */\nexport const getCalendar = async () =>\n  (await idb.get('calendar', CALENDAR_2026_2027.id)) || structuredClone(CALENDAR_2026_2027);\nexport const saveCalendar = c => idb.put('calendar', c);\nexport const resetCalendar = () => idb.put('calendar', structuredClone(CALENDAR_2026_2027));\n\n/* ---------------- Classes ---------------- */\nexport async function listClasses() {\n  const rows = await idb.getAll('classes');\n  return rows.sort((a, b) => (a.ordre ?? 0) - (b.ordre ?? 0) || a.nom.localeCompare(b.nom, 'ar'));\n}\nexport const getClass = id => idb.get('classes', id);\n\nexport async function saveClass(cls) {\n  const c = { ...cls };\n  if (!c.id) { c.id = uid('cls'); c.createdAt = now(); }\n  if (c.ordre === undefined || c.ordre === null || c.ordre === '') {\n    c.ordre = (await idb.getAll('classes')).length + 1;\n  }\n  c.ordre = Number(c.ordre);\n  await idb.put('classes', c);\n  return c;\n}\n\n/** Supprime une classe ainsi que ses élèves et ses registres mensuels. */\nexport async function deleteClass(id) {\n  await idb.deleteWhere('students', s => s.classId === id);\n  await idb.deleteWhere('registers', r => r.classId === id);\n  await idb.del('classes', id);\n}\n\n/* ---------------- Élèves ---------------- */\nexport async function listStudents(classId) {\n  const rows = await idb.byIndex('students', 'classId', classId);\n  return rows.sort((a, b) => (a.rt ?? 0) - (b.rt ?? 0));\n}\n\n/** Prochain رقم ترتيب libre : max + 1, pour éviter les doublons après suppression. */\nasync function prochainRt(classId) {\n  const rows = await listStudents(classId);\n  return rows.reduce((m, s) => Math.max(m, Number(s.rt) || 0), 0) + 1;\n}\n\nexport async function saveStudent(st) {\n  const s = { ...st };\n  if (!s.id) s.id = uid('std');\n  if (!s.rt) s.rt = await prochainRt(s.classId);\n  s.rt = Number(s.rt);\n  s.actif = s.actif !== false;\n  await idb.put('students', s);\n  return s;\n}\n\n/** Ajout en lot (saisie multiligne, import CSV, collage Excel). */\nexport async function addStudents(classId, list) {\n  let rt = (await prochainRt(classId)) - 1;\n  const rows = list.map(x => ({\n    id: uid('std'), classId, rt: ++rt,\n    nom: x.nom, codeMassar: x.codeMassar || '', sexe: x.sexe || '',\n    actif: true, dateInscription: x.dateInscription || null, dateRadiation: null,\n  }));\n  await idb.bulkPut('students', rows);\n  return rows;\n}\n\n/** Supprime l'élève et efface ses cellules dans tous les registres de sa classe. */\nexport async function deleteStudent(student) {\n  const regs = await idb.byIndex('registers', 'classId', student.classId);\n  for (const r of regs) {\n    if (r.cells?.[student.id] || r.notes?.[student.id]) {\n      delete r.cells[student.id]; delete r.notes[student.id];\n      await idb.put('registers', r);\n    }\n  }\n  await idb.del('students', student.id);\n}\n\n/** Renumérote ر.ت de 1..n dans l'ordre fourni. */\nexport async function renumber(students) {\n  const rows = students.map((s, i) => ({ ...s, rt: i + 1 }));\n  await idb.bulkPut('students', rows);\n  return rows;\n}\n\n/* ---------------- Registres mensuels ---------------- */\nexport async function getRegister(classId, mois) {\n  return (await idb.get('registers', registerId(classId, mois))) || emptyRegister(classId, mois);\n}\nexport const saveRegister = reg => idb.put('registers', { ...reg, updatedAt: now() });\n\nexport async function registersByMois(classId) {\n  const rows = await idb.byIndex('registers', 'classId', classId);\n  return Object.fromEntries(rows.map(r => [r.mois, r]));\n}\n\n/* ---------------- Divers ---------------- */\nexport const dumpAll = async () => Object.fromEntries(\n  await Promise.all(idb.STORES.map(async s => [s, await idb.getAll(s)]))\n);\n"],["src/core/schoolCalendar.js","/** Calendrier scolaire : jours ouvrés, week-ends, congés, anssaf ayam. */\nimport { NOMS_MOIS } from '__MOD__src/data/calendar-2026-2027.js__';\n\nexport const DAY_AB   = ['أ','ث','ث','ر','خ','ج','س'];                 // comme sur le registre papier\nexport const DAY_NAME = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];\n\n/** '2026-10-05' -> Date (midi local, insensible aux fuseaux/heure d'été) */\nexport const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };\nexport const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;\nexport const daysInMonth = mois => { const [y,m] = mois.split('-').map(Number); return new Date(y, m, 0).getDate(); };\nexport const moisLabel = mois => `${NOMS_MOIS[mois.split('-')[1]]} ${mois.split('-')[0]}`;\nexport const todayISO = () => iso(new Date());\n\n/** Période (congé/férié/examen) couvrant une date ; la plus courte l'emporte (la plus spécifique). */\nexport function periodeAt(cal, dateISO) {\n  let best = null, bestLen = Infinity;\n  for (const p of cal.periodes || []) {\n    if (dateISO < p.du || dateISO > (p.au || p.du)) continue;\n    const len = (parseISO(p.au || p.du) - parseISO(p.du)) / 86400000;\n    if (len < bestLen) { best = p; bestLen = len; }\n  }\n  return best;\n}\n\n/**\n * Décrit un jour du calendrier scolaire.\n * kind : 'ecole' | 'weekend' | 'conge' | 'hors'\n * capacite : nombre d'anssaf ayam d'étude que porte ce jour (0, 1 ou 2)\n */\nexport function dayInfo(cal, dateISO) {\n  const d = parseISO(dateISO);\n  const dow = d.getDay();\n  const info = { date: dateISO, dow, ab: DAY_AB[dow], nom: DAY_NAME[dow], jour: d.getDate(), periode: null, kind: 'ecole', capacite: 2 };\n\n  if (dateISO < cal.debutAnnee || dateISO > cal.finAnnee) { info.kind = 'hors'; info.capacite = 0; return info; }\n\n  // La période l'emporte sur le week-end : le libellé de la vacance couvre\n  // ainsi toute la plage grisée, comme sur le registre papier.\n  const p = periodeAt(cal, dateISO);\n  if (p) { info.kind = 'conge'; info.periode = p; info.capacite = 0; return info; }\n\n  if ((cal.joursWeekend || []).includes(dow)) { info.kind = 'weekend'; info.capacite = 0; return info; }\n\n  if ((cal.joursDemiJournee || []).includes(dow)) info.capacite = 1;\n  return info;\n}\n\nexport const estOuvre = (cal, dateISO) => dayInfo(cal, dateISO).capacite > 0;\n\n/** Tous les jours d'un mois '2026-10', décrits. */\nexport function monthDays(cal, mois) {\n  const n = daysInMonth(mois);\n  const out = [];\n  for (let j = 1; j <= n; j++) out.push(dayInfo(cal, `${mois}-${String(j).padStart(2,'0')}`));\n  return out;\n}\n\n/**\n * Anssaf ayam d'étude d'un mois, éventuellement bornés par les dates\n * d'inscription / de radiation d'un élève.\n */\nexport function anssafEtudeMois(cal, mois, { from = null, to = null } = {}) {\n  let total = 0;\n  for (const d of monthDays(cal, mois)) {\n    if (from && d.date < from) continue;\n    if (to && d.date > to) continue;\n    total += d.capacite;\n  }\n  return total;\n}\n\n/** Regroupe les jours consécutifs partageant la même période (pour l'affichage vertical du libellé). */\nexport function spansConges(days) {\n  const spans = [];\n  let cur = null;\n  for (const d of days) {\n    const key = d.periode ? d.periode.id : (d.kind === 'ecole' ? null : d.kind);\n    if (cur && cur.key === key && key !== null) { cur.len++; continue; }\n    cur = { key, len: 1, day: d, start: d.jour };\n    spans.push(cur);\n  }\n  return spans;\n}\n"],["src/ui/app.js","/** État partagé de l'application (chargé une fois, rafraîchi à la demande). */\nimport * as repo from '__MOD__src/db/repo.js__';\nimport { MOIS_SCOLAIRES } from '__MOD__src/data/calendar-2026-2027.js__';\nimport { todayISO } from '__MOD__src/core/schoolCalendar.js__';\n\nconst LS_CLASS = 'sijil.classId';\nconst LS_MOIS  = 'sijil.mois';\n\nexport const app = {\n  settings: null,\n  calendar: null,\n  classes: [],\n  classId: localStorage.getItem(LS_CLASS) || null,\n  mois: localStorage.getItem(LS_MOIS) || moisParDefaut(),\n};\n\nfunction moisParDefaut() {\n  const m = todayISO().slice(0, 7);\n  return MOIS_SCOLAIRES.includes(m) ? m : MOIS_SCOLAIRES[0];\n}\n\nexport async function refresh() {\n  app.settings = await repo.getSettings();\n  app.calendar = await repo.getCalendar();\n  app.classes = await repo.listClasses();\n  if (!app.classes.some(c => c.id === app.classId)) app.classId = app.classes[0]?.id || null;\n  if (!MOIS_SCOLAIRES.includes(app.mois)) app.mois = moisParDefaut();\n  return app;\n}\n\nexport function setClass(id) { app.classId = id; localStorage.setItem(LS_CLASS, id ?? ''); }\nexport function setMois(m)   { app.mois = m;    localStorage.setItem(LS_MOIS, m); }\nexport const currentClass = () => app.classes.find(c => c.id === app.classId) || null;\n"],["src/i18n/index.js","/**\n * Bascule arabe / français de l'interface.\n *\n * La clé de traduction est la chaîne arabe elle-même : une chaîne sans\n * traduction retombe naturellement sur l'arabe, jamais sur un code technique.\n * Le registre imprimé et les PDF restent en arabe : ce sont des documents\n * officiels dont la mise en forme ne dépend pas de la langue de l'interface.\n */\n\nimport { NOMS_MOIS } from '__MOD__src/data/calendar-2026-2027.js__';\n\nexport const LANGUES = { ar: 'العربية', fr: 'Français' };\n\nlet langue = 'ar';\n\nexport const getLangue = () => langue;\n\nexport function setLangue(l) {\n  langue = l === 'fr' ? 'fr' : 'ar';\n  const de = document.documentElement;\n  de.lang = langue;\n  de.dir = langue === 'fr' ? 'ltr' : 'rtl';\n  return langue;\n}\n\n/** t('الأقسام') · t('{n} قسم', { n: 3 }) */\nexport function t(ar, vars) {\n  let s = langue === 'fr' ? (FR[ar] ?? ar) : ar;\n  if (vars) pprimer toutes les données',\n  'سيتم محو كل شيء نهائيا. تأكد من إنشاء نسخة احتياطية أولا.':\n    'Tout sera effacé définitivement. Assurez-vous d’avoir créé une sauvegarde.',\n  'حذف كل شيء': 'Tout supprimer',\n  'تم محو كل المعطيات': 'Toutes les données ont été effacées',\n\n  /* --- Noms de fichiers exportés --- */\n  'فوج 1': 'Groupe 1',\n  'سجل': 'registre',\n  'حصيلة-سنوية': 'bilan-annuel',\n  'نسخة-احتياطية': 'sauvegarde',\n\n  /* --- Divers --- */\n  'تم الحفظ ✓': 'Enregistré ✓',\n  'تم استرجاع الاتصال': 'Connexion rétablie',\n  'تعذر فتح قاعدة البيانات': 'Impossible d’ouvrir la base de données',\n  'قد يكون التصفح في وضع خاص أو أن التخزين المحلي معطّل في هذا المتصفح.':\n    'La navigation privée est peut-être active, ou le stockage local est désactivé dans ce navigateur.',\n\n  /* --- Jours de la semaine (interface uniquement) --- */\n  'الأحد': 'Dimanche', 'الاثنين': 'Lundi', 'الثلاثاء': 'Mardi', 'الأربعاء': 'Mercredi',\n  'الخميس': 'Jeudi', 'الجمعة': 'Vendredi', 'السبت': 'Samedi',\n};\n"],["src/ui/router.js","/** Routage par hash + barre de navigation. */\nimport { qs, clear, h } from '__MOD__src/utils/dom.js__';\nimport { t } from '__MOD__src/i18n/index.js__';\n\nconst routes = new Map();\nlet current = null;\n\nexport function route(path, label, render) { routes.set(path, { label, render }); }\n\nexport function navigate(path) {\n  if (location.hash.slice(1) === path) renderCurrent();\n  else location.hash = path;\n}\n\nexport function renderNav() {\n  const nav = clear(qs('#nav'));\n  const active = location.hash.slice(1) || '/register';\n  for (const [path, def] of routes) {\n    if (!def.label) continue;\n    nav.append(h('a', { href: '#' + path, class: path === active ? 'active' : '' }, t(def.label)));\n  }\n}\n\nexport async function renderCurrent() {\n  const path = location.hash.slice(1) || '/register';\n  const def = routes.get(path) || routes.get('/register');\n  current = path;\n  renderNav();\n  const view = clear(qs('#view'));\n  window.scrollTo(0, 0);\n  try {\n    const node = await def.render();\n    if (node) view.append(node);\n  } catch (err) {\n    console.error(err);\n    view.append(h('div.card', {}, h('h2', {}, t('خطأ')), h('p.muted', {}, String(err.message || err))));\n  }\n}\n\nexport function startRouter() {\n  addEventListener('hashchange', renderCurrent);\n  renderCurrent();\n}\n\nexport const currentPath = () => current;\n"],["src/ui/components/pickers.js","/** Sélecteurs réutilisables : classe et mois scolaire. */\nimport { h } from '__MOD__src/utils/dom.js__';\nimport { app, setClass, setMois } from '__MOD__src/ui/app.js__';\nimport { MOIS_SCOLAIRES } from '__MOD__src/data/calendar-2026-2027.js__';\nimport { t, moisLabelUI } from '__MOD__src/i18n/index.js__';\n\nexport function classSelect(onChange) {\n  const sel = h('select', {\n    onchange: e => { setClass(e.target.value); onChange?.(e.target.value); },\n  }, app.classes.map(c => h('option', {\n    value: c.id, selected: c.id === app.classId,\n  }, `${c.nom}${c.fawj ? ' — ' + c.fawj : ''}`)));\n  if (!app.classes.length) { sel.append(h('option', { value: '' }, t('لا يوجد قسم'))); sel.disabled = true; }\n  return h('div.field', {}, h('label', {}, t('القسم')), sel);\n}\n\nexport function moisSelect(onChange) {\n  return h('div.field', {}, h('label', {}, t('الشهر')),\n    h('select', {\n      onchange: e => { setMois(e.target.value); onChange?.(e.target.value); },\n    }, MOIS_SCOLAIRES.map(m => h('option', { value: m, selected: m === app.mois }, moisLabelUI(m)))));\n}\n\nexport function emptyState(icon, titre, texte, action) {\n  return h('div.card', {}, h('div.empty', {},\n    h('div.big', {}, icon), h('h2', {}, titre), h('p.muted', {}, texte), action || null));\n}\n"],["src/core/stats.js","/** Calculs : anssaf ayam, نسبة المواظبة mensuelle et annuelle, alertes. */\nimport { monthDays } from '__MOD__src/core/schoolCalendar.js__';\nimport { poidsAbsence, estJustifie } from '__MOD__src/core/attendance.js__';\nimport { MOIS_SCOLAIRES } from '__MOD__src/data/calendar-2026-2027.js__';\n\nexport const pct = (num, den) => (den > 0 ? Math.round((num / den) * 10000) / 100 : 0);\n\n/**\n * Statistiques d'un mois pour une classe.\n * Rien n'est stocké : tout est recalculé à partir du calendrier courant,\n * ce qui garde les taux justes même si une date de vacances est corrigée après coup.\n */\nexport function statsMois(cal, mois, students, register, settings = {}) {\n  const days = monthDays(cal, mois);\n  const cells = register?.cells || {};\n  const notes = register?.notes || {};\n  const seuilAbs = settings.seuilAlerteAbsence ?? 8;\n  const seuilTaux = settings.seuilTauxFaible ?? 90;\n\n  const rows = students.map(st => {\n    let etude = 0, absence = 0, justifiee = 0, retards = 0;\n    const cs = cells[st.id] || {};\n    for (const d of days) {\n      if (d.capacite <= 0) continue;\n      if (st.dateInscription && d.date < st.dateInscription) continue;\n      if (st.dateRadiation && d.date > st.dateRadiation) continue;\n      etude += d.capacite;\n      const code = cs[String(d.jour)];\n      if (!code) continue;\n      if (code === 'r') { retards++; continue; }\n      const p = poidsAbsence(code, d.capacite);\n      absence += p;\n      if (estJustifie(code)) justifiee += p;\n    }\n    const presence = Math.max(0, etude - absence);\n    const taux = pct(presence, etude);\n    return {\n      student: st, etude, absence, justifiee,\n      nonJustifiee: absence - justifiee, retards, presence, taux,\n      note: notes[st.id] || '',\n      alerte: etude > 0 && (absence >= seuilAbs || taux < seuilTaux),\n    };\n  });\n\n  const totalEtude = rows.reduce((s, r) => s + r.etude, 0);\n  const totalPresence = rows.reduce((s, r) => s + r.presence, 0);\n  const totalAbsence = rows.reduce((s, r) => s + r.absence, 0);\n\n  return {\n    mois, days, rows,\n    totals: {\n      etude: totalEtude, presence: totalPresence, absence: totalAbsence,\n      taux: pct(totalPresence, totalEtude),\n      joursOuvres: days.filter(d => d.capacite > 0).length,\n    },\n  };\n}\n\n/** Synthèse annuelle d'une classe : cumul de septembre à juin. */\nexport function statsAnnee(cal, students, registersByMois, settings = {}) {\n  const parMois = [];\n  const cumul = new Map(students.map(s => [s.id, {\n    student: s, etude: 0, absence: 0, justifiee: 0, retards: 0, presence: 0, taux: 0, moisAlerte: 0,\n  }]));\n\n  for (const mois of MOIS_SCOLAIRES) {\n    const s = statsMois(cal, mois, students, registersByMois[mois], settings);\n    parMois.push({ mois, taux: s.totals.taux, etude: s.totals.etude, absence: s.totals.absence });\n    for (const r of s.rows) {\n      const c = cumul.get(r.student.id);\n      c.etude += r.etude; c.absence += r.absence; c.justifiee += r.justifiee;\n      c.retards += r.retards; c.presence += r.presence;\n      if (r.alerte) c.moisAlerte++;\n    }\n  }\n\n  const eleves = [...cumul.values()].map(c => ({\n    ...c, nonJustifiee: c.absence - c.justifiee, taux: pct(c.presence, c.etude),\n  })).sort((a, b) => a.taux - b.taux);\n\n  const etude = eleves.reduce((s, e) => s + e.etude, 0);\n  const presence = eleves.reduce((s, e) => s + e.presence, 0);\n\n  return {\n    parMois, eleves,\n    global: {\n      etude, presence, absence: etude - presence, taux: pct(presence, etude),\n      enAlerte: eleves.filter(e => e.etude > 0 && e.taux < (settings.seuilTauxFaible ?? 90)).length,\n    },\n  };\n}\n"],["src/utils/csv.js","/** Lecture / écriture CSV et collage depuis Excel (TSV). */\n\n/** Détecte le séparateur le plus probable sur la première ligne. */\nfunction guessSep(text) {\n  const line = text.split(/\\r?\\n/).find(l => l.trim()) || '';\n  const counts = { ',': 0, ';': 0, '\\t': 0 };\n  let inQ = false;\n  for (const ch of line) {\n    if (ch === '\"') inQ = !inQ;\n    else if (!inQ && ch in counts) counts[ch]++;\n  }\n  return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][1] ? Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0] : ';';\n}\n\n/** Analyse un CSV/TSV (guillemets doubles gérés) -> tableau de tableaux. */\nexport function parseDelimited(text, sep = null) {\n  const src = text.replace(/^﻿/, '');          // BOM Excel\n  const d = sep || guessSep(src);\n  const rows = [];\n  let row = [], field = '', inQ = false;\n  for (let i = 0; i < src.length; i++) {\n    const ch = src[i];\n    if (inQ) {\n      if (ch === '\"') { if (src[i + 1] === '\"') { field += '\"'; i++; } else inQ = false; }\n      else field += ch;\n    } else if (ch === '\"') inQ = true;\n    else if (ch === d) { row.push(field); field = ''; }\n    else if (ch === '\\n') { row.push(field); rows.push(row); row = []; field = ''; }\n    else if (ch !== '\\r') field += ch;\n  }\n  if (field !== '' || row.length) { row.push(field); rows.push(row); }\n  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c !== ''));\n}\n\nconst q = v => {\n  const s = String(v ?? '');\n  return /[\",;\\n]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s;\n};\n\n/** Génère un CSV lisible par Excel arabe (BOM + séparateur ';'). */\nexport function toCSV(rows, sep = ';') {\n  return '﻿' + rows.map(r => r.map(q).join(sep)).join('\\r\\n');\n}\n"],["src/export/print.js","/**\n * Impression fidèle au registre officiel (A4 paysage).\n * Construit une zone #print-area puis appelle window.print()\n * → « Enregistrer au format PDF » donne un PDF vectoriel, arabe parfaitement lié.\n */\nimport { h, qs } from '__MOD__src/utils/dom.js__';\nimport { STATES } from '__MOD__src/core/attendance.js__';\nimport { statsMois } from '__MOD__src/core/stats.js__';\nimport { moisLabel, spansConges } from '__MOD__src/core/schoolCalendar.js__';\n\nconst MINISTERE = 'وزارة التربية الوطنية والتعليم الأولي والرياضة';\n\n/** Une page A4 paysage pour un mois donné. */\nexport function feuilleMois({ settings, cls, cal, mois, students, reg }) {\n  const s = statsMois(cal, mois, students, reg, settings);\n  const days = s.days;\n\n  const labelParJour = {};\n  for (const sp of spansConges(days)) if (sp.day.periode) labelParJour[sp.day.jour] = sp.day.periode.libelle;\n\n  const thead = h('thead', {},\n    h('tr', { class: 'vac' },\n      h('th.rt', {}, 'ر.ت'),\n      h('th.nom', {}, 'الاسم والنسب'),\n      days.map(d => h('th', { class: d.capacite <= 0 ? 'off' : '' },\n        labelParJour[d.jour] ? h('span.vlabel', {}, labelParJour[d.jour]) : null,\n        h('div', {}, String(d.jour)),\n        h('div', {}, d.ab))),\n      h('th.sum', {}, 'أنصاف أيام الدراسة'),\n      h('th.sum', {}, 'أنصاف أيام الغياب'),\n      h('th.sum', {}, 'أنصاف أيام الحضور'),\n      h('th.sum', {}, 'النسبة %'),\n      h('th.note', {}, 'ملاحظات')));\n\n  const tbody = h('tbody', {}, s.rows.map(r => h('tr', {},\n    h('td.rt', {}, String(r.student.rt)),\n    h('td.nom', {}, r.student.nom),\n    days.map(d => {\n      const code = reg?.cells?.[r.student.id]?.[String(d.jour)] || '';\n      const hors = (r.student.dateInscription && d.date < r.student.dateInscription) ||\n                   (r.student.dateRadiation && d.date > r.student.dateRadiation);\n      return h('td', {\n        class: d.capacite <= 0 ? 'off' : code === 'aj' ? 'aj' : code ? 'a' : '',\n      }, d.capacite <= 0 || hors ? '' : (STATES[code]?.court || ''));\n    }),\n    h('td.sum', {}, String(r.etude)),\n    h('td.sum', {}, String(r.absence)),\n    h('td.sum', {}, String(r.presence)),\n    h('td.sum', {}, r.etude ? r.taux.toFixed(2) : '—'),\n    h('td.note', {}, r.note || ''))));\n\n  // Le registre officiel comporte 40 lignes : on complète avec des lignes vierges.\n  const LIGNES_REGISTRE = 40;\n  for (let i = s.rows.length; i < LIGNES_REGISTRE; i++) {\n    tbody.append(h('tr', {},\n      h('td.rt', {}, String(i + 1)),\n      h('td.nom', {}, ''),\n      days.map(d => h('td', { class: d.capacite <= 0 ? 'off' : '' }, '')),\n      h('td.sum', {}, ''), h('td.sum', {}, ''), h('td.sum', {}, ''), h('td.sum', {}, ''),\n      h('td.note', {}, '')));\n  }\n\n  const tfoot = h('tfoot', {}, h('tr', {},\n    h('td', { colSpan: 2 + days.length }, 'نسبة المواظبة الشهرية بـ %'),\n    h('td', {}, String(s.totals.etude)),\n    h('td', {}, String(s.totals.absence)),\n    h('td', { colSpan: 2 }, s.totals.taux.toFixed(2) + ' %'),\n    h('td', {}, '')));\n\n  return h('section.sheet', {},\n    h('div.sheet-head', {},\n      h('div.kingdom', {}, 'المملكة المغربية'),\n      h('div.ministry', {}, MINISTERE),\n      h('div.ministry', {}, `${settings.academie} — ${settings.direction}`),\n      h('div.title', {}, 'سجل الحضور والغياب'),\n    ),\n    h('div.sheet-meta', {},\n      h('span', {}, h('b', {}, 'المؤسسة: '), settings.etablissement),\n      h('span', {}, h('b', {}, 'الأستاذ(ة): '), settings.enseignant),\n      h('span', {}, h('b', {}, 'المستوى: '), `${cls.niveau || ''} ${cls.nom}`),\n      cls.fawj ? h('span', {}, h('b', {}, 'الفوج: '), cls.fawj) : null,\n      cls.matiere ? h('span', {}, h('b', {}, 'المادة: '), cls.matiere) : null,\n      h('span', {}, h('b', {}, 'الشهر: '), moisLabel(mois)),\n      h('span', {}, h('b', {}, 'السنة الدراسية: '), settings.anneeScolaire),\n    ),\n    h('table.sheet-grid', {}, thead, tbody, tfoot),\n    h('div.sheet-foot', {},\n      h('span', {}, `${settings.enseignantFr || ''} — ${settings.anneeScolaire}`),\n      h('span.sig', {}, 'إمضاء الأستاذ(ة)'),\n      h('span.sig', {}, 'إمضاء السيد(ة) المدير(ة)')));\n}\n\nfunction zone() {\n  let z = qs('#print-area');\n  if (!z) { z = h('div', { id: 'print-area' }); document.body.append(z); }\n  z.innerHTML = '';\n  return z;\n}\n\n/** Imprime un ou plusieurs mois. */\nexport function imprimerMois(ctx) {\n  const z = zone();\n  z.append(feuilleMois(ctx));\n  lancerImpression();\n}\n\nexport function imprimerPlusieursMois({ settings, cls, cal, moisListe, students, regs }) {\n  const z = zone();\n  for (const mois of moisListe) z.append(feuilleMois({ settings, cls, cal, mois, students, reg: regs[mois] }));\n  lancerImpression();\n}\n\nfunction lancerImpression() {\n  const nettoyer = () => { const z = qs('#print-area'); if (z) z.innerHTML = ''; };\n  addEventListener('afterprint', nettoyer, { once: true });\n  setTimeout(() => window.print(), 60);\n}\n"],["src/export/pdf.js","/**\n * Export PDF téléchargeable, sans aucune librairie externe.\n *\n * La page du registre est dessinée sur un <canvas> (le navigateur assure\n * la liaison des lettres arabes et le rendu RTL), puis encapsulée dans un\n * PDF construit octet par octet (image JPEG /DCTDecode, une page A4 paysage\n * par mois). Le rendu vectoriel de meilleure qualité reste le bouton « طباعة ».\n */\nimport { download } from '__MOD__src/utils/dom.js__';\nimport { STATES } from '__MOD__src/core/attendance.js__';\nimport { statsMois } from '__MOD__src/core/stats.js__';\nimport { moisLabel, spansConges } from '__MOD__src/core/schoolCalendar.js__';\n\nconst PT_W = 842, PT_H = 595;            // A4 paysage en points\nconst SCALE = 2.6;                        // ≈ 190 dpi\nconst POLICE = '\"Amiri\",\"Cairo\",\"Noto Naskh Arabic\",\"Tahoma\",serif';\nconst VERT = '#0d3b2e', DORE = '#c9a227', GRIS = '#cfc8b6', TRAIT = '#4a5b55';\nconst LIGNES_PAR_PAGE = 40;\n\nconst font = (px, bold = false) => `${bold ? '700 ' : ''}${px}px ${POLICE}`;\n\nfunction texte(ctx, str, x, y, { align = 'center', size = 6, bold = false, color = '#101a17', maxW = 0 } = {}) {\n  ctx.font = font(size, bold);\n  ctx.fillStyle = color;\n  ctx.textAlign = align;\n  ctx.textBaseline = 'middle';\n  let s = String(str ?? '');\n  if (maxW) {\n    while (s.length > 1 && ctx.measureText(s).width > maxW) s = s.slice(0, -1);\n  }\n  ctx.fillText(s, x, y);\n}\n\n/** Texte pivoté à 90° : il s'élève depuis le point d'ancrage (bas) vers le haut. */\nfunction texteVertical(ctx, str, x, y, { size = 5, color = '#101a17', maxH = 60 } = {}) {\n  ctx.save();\n  ctx.translate(x, y);\n  ctx.rotate(-Math.PI / 2);\n  texte(ctx, str, 0, 0, { align: 'left', size, color, maxW: maxH });\n  ctx.restore();\n}\n\n/** Dessine une page du registre. Retourne le canvas. */\nexport function dessinerPage({ settings, cls, cal, mois, stats, reg, rows, pageIndex, pageTotal }) {\n  const cv = document.createElement('canvas');\n  cv.width = Math.round(PT_W * SCALE);\n  cv.height = Math.round(PT_H * SCALE);\n  const ctx = cv.getContext('2d');\n  ctx.scale(SCALE, SCALE);\n  ctx.direction = 'rtl';\n\n  ctx.fillStyle = '#ffffff';\n  ctx.fillRect(0, 0, PT_W, PT_H);\n\n  /* --- cadre décoratif --- */\n  ctx.strokeStyle = VERT; ctx.lineWidth = 2.2;\n  ctx.strokeRect(10, 10, PT_W - 20, PT_H - 20);\n  ctx.strokeStyle = DORE; ctx.lineWidth = 0.8;\n  ctx.strokeRect(14, 14, PT_W - 28, PT_H - 28);\n\n  const cx = PT_W / 2;\n  texte(ctx, 'المملكة المغربية', cx, 30, { size: 10, bold: true, color: VERT });\n  texte(ctx, 'وزارة التربية الوطنية والتعليم الأولي والرياضة', cx, 43, { size: 8.5 });\n  texte(ctx, `${settings.academie} — ${settings.direction}`, cx, 55, { size: 8 });\n\n  texte(ctx, 'سجل الحضور والغياب', cx, 73, { size: 15, bold: true, color: VERT });\n  ctx.strokeStyle = DORE; ctx.lineWidth = 1;\n  ctx.beginPath(); ctx.moveTo(cx - 90, 82); ctx.lineTo(cx + 90, 82); ctx.stroke();\n\n  /* --- bandeau d'informations --- */\n  const infos = [\n    `المؤسسة: ${settings.etablissement}`,\n    `الأستاذ(ة): ${settings.enseignant}`,\n    `القسم: ${cls.niveau ? cls.niveau + ' — ' : ''}${cls.nom}${cls.fawj ? ' / ' + cls.fawj : ''}`,\n    `الشهر: ${moisLabel(mois)}`,\n    `السنة الدراسية: ${settings.anneeScolaire}`,\n  ];\n  let ix = PT_W - 24;\n  for (const info of infos) {\n    ctx.font = font(7.4);\n    const w = ctx.measureText(info).width;\n    texte(ctx, info, ix, 95, { align: 'right', size: 7.4, color: VERT });\n    ix -= w + 16;\n  }\n\n  /* --- géométrie du tableau --- */\n  const marge = 24;\n  const droite = PT_W - marge, gauche = marge;\n  const largeurTotale = droite - gauche;\n  const wRt = 18, wNom = 112, wSum = 21, wNote = 66;\n  const days = stats.days;\n  const wJour = (largeurTotale - wRt - wNom - wSum * 4 - wNote) / days.length;\n\n  const top = 104, bottom = PT_H - 40;\n  const hEntete = 70, hPied = 11;\n  const hLigne = Math.min(11, (bottom - top - hEntete - hPied) / Math.max(rows.length, 1));\n  const tableBas = top + hEntete + hLigne * rows.length + hPied;\n\n  // positions x (de droite à gauche)\n  const colonnes = [];\n  let x = droite;\n  const pousser = (w, kind, data) => { colonnes.push({ x: x - w, w, kind, data }); x -= w; };\n  pousser(wRt, 'rt');\n  pousser(wNom, 'nom');\n  for (const d of days) pousser(wJour, 'jour', d);\n  pousser(wSum, 'etude'); pousser(wSum, 'absence'); pousser(wSum, 'presence'); pousser(wSum, 'taux');\n  pousser(wNote, 'note');\n\n  const libelleSum = { etude: 'أنصاف أيام الدراسة', absence: 'أنصاف أيام الغياب', presence: 'أنصاف أيام الحضور', taux: 'النسبة %' };\n\n  /* --- fonds des colonnes de congé --- */\n  for (const c of colonnes) {\n    if (c.kind === 'jour' && c.data.capacite <= 0) {\n      ctx.fillStyle = GRIS;\n      ctx.fillRect(c.x, top, c.w, tableBas - top - hPied);\n    }\n    if (['etude', 'absence', 'presence', 'taux'].includes(c.kind)) {\n      ctx.fillStyle = '#f5f2e7';\n      ctx.fillRect(c.x, top + hEntete, c.w, hLigne * rows.length);\n    }\n  }\n  ctx.fillStyle = '#e6efea';\n  ctx.fillRect(gauche, top, largeurTotale, hEntete);\n  ctx.fillRect(gauche, tableBas - hPied, largeurTotale, hPied);\n\n  /* --- en-tête --- */\n  const labelParJour = {};\n  for (const sp of spansConges(days)) if (sp.day.periode) labelParJour[sp.day.jour] = sp.day.periode.libelle;\n\n  for (const c of colonnes) {\n    const mid = c.x + c.w / 2;\n    if (c.kind === 'rt') texte(ctx, 'ر.ت', mid, top + hEntete - 8, { size: 6, bold: true });\n    else if (c.kind === 'nom') texte(ctx, 'الاسم والنسب', mid, top + hEntete - 8, { size: 7.5, bold: true });\n    else if (c.kind === 'note') texte(ctx, 'ملاحظات', mid, top + hEntete - 8, { size: 7, bold: true });\n    else if (c.kind === 'jour') {\n      texte(ctx, String(c.data.jour), mid, top + hEntete - 14, { size: 6, bold: true });\n      texte(ctx, c.data.ab, mid, top + hEntete - 6, { size: 5.2 });\n      if (labelParJour[c.data.jour]) {\n        texteVertical(ctx, labelParJour[c.data.jour], mid + 2, top + hEntete - 19, { size: 4.5, maxH: hEntete - 22 });\n      }\n    } else {\n      texteVertical(ctx, libelleSum[c.kind], mid + 2.2, top + hEntete - 3, { size: 5, maxH: hEntete - 6 });\n    }\n  }\n\n  /* --- lignes --- */\n  rows.forEach((r, i) => {\n    const y = top + hEntete + hLigne * i + hLigne / 2;\n    for (const c of colonnes) {\n      const mid = c.x + c.w / 2;\n      if (c.kind === 'rt') texte(ctx, String(r.student.rt), mid, y, { size: 5.6 });\n      else if (c.kind === 'nom') texte(ctx, r.student.nom, c.x + c.w - 2, y, { align: 'right', size: 7, maxW: c.w - 4 });\n      else if (c.kind === 'note') texte(ctx, r.note, c.x + c.w - 2, y, { align: 'right', size: 5.4, maxW: c.w - 4 });\n      else if (c.kind === 'jour') {\n        if (c.data.capacite <= 0) continue;\n        const hors = (r.student.dateInscription && c.data.date < r.student.dateInscription) ||\n                     (r.student.dateRadiation && c.data.date > r.student.dateRadiation);\n        if (hors) continue;\n        const code = reg?.cells?.[r.student.id]?.[String(c.data.jour)] || '';\n        if (!code) continue;\n        texte(ctx, STATES[code].court, mid, y, {\n          size: 6, bold: true, color: code === 'aj' || code === 'r' ? '#8a6508' : '#b3261e',\n        });\n      } else {\n        const v = c.kind === 'taux' ? (r.etude ? r.taux.toFixed(1) : '—')\n          : c.kind === 'etude' ? r.etude : c.kind === 'absence' ? r.absence : r.presence;\n        texte(ctx, v, mid, y, { size: 5.6, bold: true, color: VERT });\n      }\n    }\n  });\n\n  /* --- pied du tableau : نسبة المواظبة الشهرية --- */\n  const yPied = tableBas - hPied / 2;\n  texte(ctx, 'نسبة المواظبة الشهرية بـ %', droite - 8, yPied, { align: 'right', size: 6.4, bold: true, color: VERT });\n  const colTaux = colonnes.find(c => c.kind === 'taux');\n  texte(ctx, stats.totals.taux.toFixed(2) + ' %', colTaux.x + colTaux.w / 2, yPied, { size: 6.4, bold: true, color: VERT });\n\n  /* --- grille --- */\n  ctx.strokeStyle = TRAIT; ctx.lineWidth = 0.28;\n  ctx.beginPath();\n  for (const c of colonnes) { ctx.moveTo(c.x, top); ctx.lineTo(c.x, tableBas); }\n  ctx.moveTo(droite, top); ctx.lineTo(droite, tableBas);\n  for (let i = 0; i <= rows.length; i++) {\n    const y = top + hEntete + hLigne * i;\n    ctx.moveTo(gauche, y); ctx.lineTo(droite, y);\n  }\n  ctx.moveTo(gauche, top); ctx.lineTo(droite, top);\n  ctx.moveTo(gauche, tableBas - hPied); ctx.lineTo(droite, tableBas - hPied);\n  ctx.moveTo(gauche, tableBas); ctx.lineTo(droite, tableBas);\n  ctx.stroke();\n\n  /* --- pied de page --- */\n  texte(ctx, `${settings.enseignantFr || settings.enseignant} — ${settings.anneeScolaire}`,\n    droite, PT_H - 24, { align: 'right', size: 6.6, color: '#31413b' });\n  texte(ctx, 'إمضاء الأستاذ(ة)', cx, PT_H - 24, { size: 6.6, color: '#31413b' });\n  texte(ctx, pageTotal > 1 ? `${pageIndex + 1}/${pageTotal}` : '',\n    gauche, PT_H - 24, { align: 'left', size: 6.2, color: '#31413b' });\n\n  return cv;\n}\n\nconst canvasEnJpeg = (cv, q = 0.85) => new Promise((resolve, reject) =>\n  cv.toBlob(b => b ? b.arrayBuffer().then(a => resolve(new Uint8Array(a))) : reject(new Error('toBlob')), 'image/jpeg', q));\n\n/** Construit un PDF multi-pages (une image JPEG par page). */\nfunction construirePdf(pages) {\n  const enc = new TextEncoder();\n  const morceaux = [];\n  let taille = 0;\n  const push = v => { const u = typeof v === 'string' ? enc.encode(v) : v; morceaux.push(u); taille += u.length; };\n  const offsets = [];\n\n  push(new Uint8Array([0x25, 0x50, 0x44, 0x46, 0x2d, 0x31, 0x2e, 0x34, 0x0a, 0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a]));\n\n  const kids = pages.map((_, i) => `${3 + i * 3} 0 R`).join(' ');\n  offsets[1] = taille; push(`1 0 obj\\n<< /Type /Catalog /Pages 2 0 R >>\\nendobj\\n`);\n  offsets[2] = taille; push(`2 0 obj\\n<< /Type /Pages /Kids [${kids}] /Count ${pages.length} >>\\nendobj\\n`);\n\n  pages.forEach((p, i) => {\n    const pid = 3 + i * 3, cid = pid + 1, iid = pid + 2;\n    const flux = `q ${PT_W} 0 0 ${PT_H} 0 0 cm /Im0 Do Q\\n`;\n    offsets[pid] = taille;\n    push(`${pid} 0 obj\\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PT_W} ${PT_H}] ` +\n         `/Resources << /XObject << /Im0 ${iid} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${cid} 0 R >>\\nendobj\\n`);\n    offsets[cid] = taille;\n    push(`${cid} 0 obj\\n<< /Length ${flux.length} >>\\nstream\\n${flux}endstream\\nendobj\\n`);\n    offsets[iid] = taille;\n    push(`${iid} 0 obj\\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} ` +\n         `/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\\nstream\\n`);\n    push(p.jpeg);\n    push('\\nendstream\\nendobj\\n');\n  });\n\n  const maxId = 2 + pages.length * 3;\n  const debutXref = taille;\n  let xref = `xref\\n0 ${maxId + 1}\\n0000000000 65535 f \\n`;\n  for (let id = 1; id <= maxId; id++) xref += String(offsets[id]).padStart(10, '0') + ' 00000 n \\n';\n  push(xref);\n  push(`trailer\\n<< /Size ${maxId + 1} /Root 1 0 R >>\\nstartxref\\n${debutXref}\\n%%EOF\\n`);\n\n  return new Blob(morceaux, { type: 'application/pdf' });\n}\n\n/** Télécharge le PDF d'un ou plusieurs mois. */\nexport async function telechargerPdfMois({ settings, cls, cal, mois, students, regs, nomFichier }) {\n  const moisListe = Array.isArray(mois) ? mois : [mois];\n  const pages = [];\n\n  for (const m of moisListe) {\n    const reg = regs?.[m];\n    const stats = statsMois(cal, m, students, reg, settings);\n    const tranches = [];\n    for (let i = 0; i < stats.rows.length; i += LIGNES_PAR_PAGE) {\n      tranches.push(stats.rows.slice(i, i + LIGNES_PAR_PAGE));\n    }\n    if (!tranches.length) tranches.push([]);\n    tranches.forEach((rows, idx) => pages.push({\n      settings, cls, cal, mois: m, stats, reg, rows, pageIndex: idx, pageTotal: tranches.length,\n    }
